<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 115" width="530" height="115">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="silverDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0AEC0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <!-- Left "1" Emblem -->
  <g transform="translate(10, 5)">
    <!-- Base Silver Pillar -->
    <path d="M 15 50 L 35 37 L 35 85 L 15 97 Z" fill="url(#silverDark)" />
    <!-- Main White "1" Arrow -->
    <path d="M 10 38 L 70 2 L 70 78 L 45 94 L 45 27 L 10 44 Z" fill="url(#silverGrad)" stroke="#FFFFFF" stroke-width="0.8" />
    <!-- Back Wing Arrow -->
    <path d="M 75 14 L 105 30 L 105 55 L 75 39 Z" fill="url(#silverDark)" />
  </g>

  <!-- "PRINCIPLE 1" Main Title -->
  <g transform="translate(130, 56)">
    <text font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Arial', sans-serif" font-weight="900" font-size="46" letter-spacing="2">
      <tspan fill="#FFFFFF">PRINCIPLE </tspan>
      <tspan fill="url(#goldGrad)">1</tspan>
    </text>
  </g>

  <!-- "PROFESSIONAL SERVICES" Subtitle + Bold Glowing Gold Side Lines -->
  <g transform="translate(130, 75)">
    <!-- Left Bold Gold Line Bar -->
    <rect x="0" y="8" width="55" height="5" fill="url(#goldGrad)" rx="2.5" />
    
    <!-- Subtitle Text -->
    <text x="65" y="16" font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Arial', sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" letter-spacing="3.8">
      PROFESSIONAL SERVICES
    </text>
    
    <!-- Right Bold Gold Line Bar -->
    <rect x="338" y="8" width="55" height="5" fill="url(#goldGrad)" rx="2.5" />
  </g>
</svg>
